<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediaOS</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
  <div class="app" id="app">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">🎬</span>
          <div class="logo-text">
            <div class="logo-title">MediaOS</div>
            <div class="logo-sub">Media Department</div>
          </div>
        </div>
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
          <span class="toggle-icon">☰</span>
        </button>
      </div>

      <nav class="sidebar-nav" id="sidebarNav">
        <div class="nav-section">
          <div class="nav-section-label">NGHIÊN CỨU</div>
          <a class="nav-item" data-page="research" href="#research">
            <span class="nav-icon">🔍</span>
            <span class="nav-label">Viral Research</span>
          </a>
          <a class="nav-item" data-page="trends" href="#trends">
            <span class="nav-icon">📈</span>
            <span class="nav-label">Trend Analysis</span>
          </a>
        </div>

        <div class="nav-section">
          <div class="nav-section-label">NỘI DUNG</div>
          <a class="nav-item" data-page="knowledge" href="#knowledge">
            <span class="nav-icon">📚</span>
            <span class="nav-label">Knowledge Base</span>
          </a>
          <a class="nav-item" data-page="campaigns" href="#campaigns">
            <span class="nav-icon">🗓️</span>
            <span class="nav-label">Campaigns</span>
          </a>
          <a class="nav-item" data-page="ideas" href="#ideas">
            <span class="nav-icon">💡</span>
            <span class="nav-label">Ideas</span>
          </a>
        </div>

        <div class="nav-section">
          <div class="nav-section-label">QUẢN LÝ</div>
          <a class="nav-item" data-page="team" href="#team">
            <span class="nav-icon">👥</span>
            <span class="nav-label">Team</span>
          </a>
          <a class="nav-item" data-page="guidelines" href="#guidelines">
            <span class="nav-icon">📋</span>
            <span class="nav-label">Guidelines & SOP</span>
          </a>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="user-info">
          <span class="user-avatar">👤</span>
          <div>
            <div class="user-name">Media Team</div>
            <div class="user-role">MediaOS</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
      <div class="topbar" id="topbar">
        <button class="topbar-menu" id="topbarMenu" aria-label="Open menu">☰</button>
        <div class="topbar-title" id="topbarTitle">Viral Research Hub</div>
        <div class="topbar-actions">
          <button class="btn btn-ghost btn-sm" id="themeToggle" title="Đổi theme">🌙</button>
        </div>
      </div>
      <div class="page-container" id="pageContainer">
        <!-- Content rendered by JS -->
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Đang tải...</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
    <div class="modal" id="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">Modal</h3>
        <button class="modal-close" id="modalClose" aria-label="Đóng">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Sidebar overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/state.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/pages/research.js"></script>
  <script src="assets/js/pages/trends.js"></script>
  <script src="assets/js/pages/knowledge.js"></script>
  <script src="assets/js/pages/campaigns.js"></script>
  <script src="assets/js/pages/ideas.js"></script>
  <script src="assets/js/pages/team.js"></script>
  <script src="assets/js/pages/guidelines.js"></script>
  <script src="assets/js/router.js"></script>
  <script src="assets/js/init.js"></script>
</body>
</html>
