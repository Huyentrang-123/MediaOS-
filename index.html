<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

const getToday = () => new Date().toISOString().split('T')[0];
const formatDT = (iso) => {
  if (!iso) return '';
  return new Date(iso).toLocaleString('vi-VN', { dateStyle: 'short', timeStyle: 'short' });
};

const KOC_STATUSES = ['Gửi mail', 'Nhắn tin IG', 'Đang trao đổi', 'Đồng ý hợp tác', 'Đã xong', 'Không hợp tác'];

function kocBadgeClass(status) {
  if (status === 'Gửi mail')          return 'koc-badge koc-badge-guimail';
  if (status === 'Nhắn tin IG')       return 'koc-badge koc-badge-nhanting';
  if (status === 'Đang trao đổi')     return 'koc-badge koc-badge-dangtrao';
  if (status === 'Đồng ý hợp tác')   return 'koc-badge koc-badge-dongyhoptac';
  if (status === 'Đã xong')           return 'koc-badge koc-badge-daxong';
  if (status === 'Không hợp tác')    return 'koc-badge koc-badge-khonghop';
  return 'koc-badge koc-badge-khonghop';
}

const TRANSLATION_MODE = 'direct';

function useLocalStorage(key, initial) {
  const [val, setVal] = useState(() => {
    try { const s = localStorage.getItem(key); return s !== null ? JSON.parse(s) : initial; }
    catch { return initial; }
  });
  useEffect(() => { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }, [key, val]);
  return [val, setVal];
}

function useFirestoreCol(col) {
  const [data, setData] = useState([]);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    const unsub = db.collection(col)
      .orderBy('createdAt', 'desc')
      .onSnapshot(
        snap => { setData(snap.docs.map(d => ({ id: d.id, ...d.data() }))); setLoading(false); },
        err => { console.error('Firestore error:', col, err); setLoading(false); }
      );
    return unsub;
  }, [col]);
  return [data, loading];
}

/* ── GEMINI TRANSLATION API ── */
async function translateDirect(text, apiKey) {
  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`,
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{
          parts: [{ text: `Bạn là dịch giả chuyên nghiệp. Hãy dịch đoạn văn bản sau từ tiếng Trung phồn thể (Đài Loan) sang tiếng Việt tự nhiên, chính xác. Chỉ trả về bản dịch, không giải thích:\n\n${text}` }]
        }],
        generationConfig: { maxOutputTokens: 2048 }
      })
    }
  );
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    throw new Error(e.error?.message || `Lỗi API: ${res.status}`);
  }
  const d = await res.json();
  return d.candidates[0].content.parts[0].text;
}

async function translateProxy(text) {
  const res = await fetch('/api/translate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text })
  });
  if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.error || `Lỗi: ${res.status}`); }
  const d = await res.json();
  return d.translation;
}

function DualScrollTable({ children }) {
  const topRef = useRef(null);
  const wrapRef = useRef(null);
  const [innerWidth, setInnerWidth] = useState(0);
  const syncing = useRef(false);

  useEffect(() => {
    const wrap = wrapRef.current;
    if (!wrap) return;
    const update = () => setInnerWidth(wrap.scrollWidth);
    update();
    const ro = new ResizeObserver(update);
    ro.observe(wrap);
    return () => ro.disconnect();
  }, []);

  const onTopScroll = () => {
    if (syncing.current) return;
    syncing.current = true;
    if (wrapRef.current) wrapRef.current.scrollLeft = topRef.current.scrollLeft;
    requestAnimationFrame(() => { syncing.current = false; });
  };

  const onWrapScroll = () => {
    if (syncing.current) return;
    syncing.current = true;
    if (topRef.current) topRef.current.scrollLeft = wrapRef.current.scrollLeft;
    requestAnimationFrame(() => { syncing.current = false; });
  };

  return (
    <div className="table-scroll-outer">
      <div ref={topRef} className="table-top-scroll" onScroll={onTopScroll}>
        <div className="table-top-scroll-inner" style={{width: innerWidth}}/>
      </div>
      <div ref={wrapRef} className="table-wrapper" onScroll={onWrapScroll}>
        {children}
      </div>
    </div>
  );
}

function parseTSVRobust(rawText) {
  const rows = [];
  let row = [], field = '', inQuotes = false, i = 0;
  while (i < rawText.length) {
    const ch = rawText[i];
    if (inQuotes) {
      if (ch === '"' && rawText[i + 1] === '"') { field += '"'; i += 2; }
      else if (ch === '"') { inQuotes = false; i++; }
      else { field += ch; i++; }
    } else {
      if (ch === '"') { inQuotes = true; i++; }
      else if (ch === '\t') { row.push(field); field = ''; i++; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && rawText[i + 1] === '\n') i++;
        row.push(field); field = '';
        if (row.some(f => f.trim())) rows.push(row);
        row = []; i++;
      } else { field += ch; i++; }
    }
  }
  if (field || row.length) { row.push(field); if (row.some(f => f.trim())) rows.push(row); }
  return rows;
}

function PasteParser({ onAdd }) {
  const [text, setText] = useState('');
  const [msg, setMsg] = useState(null);

  const parse = () => {
    const hasTabs = text.includes('\t');
    const rows = hasTabs
      ? parseTSVRobust(text)
      : text.split('\n').map(l => l.trim()).filter(Boolean).map(l => l.split('|').map(s => s.trim()));

    let added = 0, skipped = 0;
    const kocs = [];

    for (const parts of rows) {
      if (!(parts[0] || '').trim()) { skipped++; continue; }
      const rawStatus = (parts[4] || '').trim();
      const status = KOC_STATUSES.includes(rawStatus) ? rawStatus : 'Gửi mail';
      kocs.push({
        name: (parts[0] || '').trim(), instagram: (parts[1] || '').trim(),
        gmail: (parts[2] || '').trim(), followers: (parts[3] || '').trim(),
        status, price: (parts[5] || '').trim(), notes: (parts[6] || '').trim(),
        address: (parts[7] || '').trim(), bankAccount: '', contractLink: '',
        lastContact: getToday(), createdAt: new Date().toISOString()
      });
      added++;
    }

    if (kocs.length) onAdd(kocs);
    setMsg({ type: added ? 'success' : 'danger',
             text: added ? `✅ Đã thêm ${added} KOC${skipped ? ` · Bỏ qua ${skipped} dòng trống` : ''}` : '⚠️ Không có dữ liệu hợp lệ để thêm' });
    setText('');
    setTimeout(() => setMsg(null), 4000);
  };

  return (
    <div className="card">
      <div className="card-title" style={{marginBottom:6}}>&#128203; Nhập dữ liệu KOC</div>
      <div style={{fontSize:12,color:'var(--text-secondary)',marginBottom:10,lineHeight:1.6}}>
        Có thể <strong>copy thẳng từ Google Sheets</strong> rồi dán vào đây.<br/>
        Hoặc nhập thủ công: <code style={{background:'var(--surface-3)',padding:'1px 6px',borderRadius:4}}>Tên | Link IG | Gmail | Follow IG | Trạng thái | Báo giá | Note | Địa chỉ</code>
      </div>
      <textarea className="form-textarea" value={text} onChange={e => setText(e.target.value)}
        placeholder="Dán dữ liệu từ Google Sheets vào đây..." style={{minHeight:100}}/>
      {msg && <div className={`alert alert-${msg.type}`} style={{marginTop:8}}>{msg.text}</div>}
      <div style={{marginTop:10}}>
        <button className="btn btn-primary" onClick={parse} disabled={!text.trim()}>&#10133; Thêm vào Database</button>
      </div>
    </div>
  );
}

function EditableCell({ value, onChange }) {
  const [editing, setEditing] = useState(false);
  const [val, setVal] = useState(value);
  const ref = useRef(null);

  useEffect(() => { setVal(value); }, [value]);
  useEffect(() => { if (editing && ref.current) ref.current.focus(); }, [editing]);

  const save = () => { setEditing(false); if (val !== value) onChange(val); };

  if (editing) return (
    <input ref={ref} value={val} onChange={e => setVal(e.target.value)}
      onBlur={save}
      onKeyDown={e => { if (e.key === 'Enter') save(); if (e.key === 'Escape') { setEditing(false); setVal(value); } }}
      style={{minWidth: 80}}/>
  );

  return (
    <span onClick={() => setEditing(true)} title="Click để chỉnh sửa"
      style={{cursor:'pointer',minWidth:50,display:'inline-block',borderBottom:'1px dashed var(--border)'}}>
      {val || <span style={{color:'var(--text-muted)'}}>&#8211;</span>}
    </span>
  );
}

function ContractLinkCell({ value, onChange }) {
  const [editing, setEditing] = useState(false);
  const [val, setVal] = useState(value || '');
  const ref = useRef(null);

  useEffect(() => { setVal(value || ''); }, [value]);
  useEffect(() => { if (editing && ref.current) ref.current.focus(); }, [editing]);

  const save = () => {
    setEditing(false);
    const trimmed = val.trim();
    if (trimmed !== (value || '')) onChange(trimmed);
  };

  if (editing) return (
    <input ref={ref} value={val} onChange={e => setVal(e.target.value)}
      onBlur={save}
      onKeyDown={e => { if (e.key === 'Enter') save(); if (e.key === 'Escape') { setEditing(false); setVal(value || ''); } }}
      placeholder="https://..." style={{minWidth: 200}}/>
  );

  if (val) return (
    <div style={{display:'flex', alignItems:'center', gap:5, whiteSpace:'nowrap'}}>
      <a href={val} target="_blank" rel="noopener noreferrer"
        style={{color:'var(--accent)',fontWeight:600,fontSize:12,display:'flex',alignItems:'center',gap:3,textDecoration:'none'}}
        title={val}>&#128279; Xem HĐ</a>
      <button className="btn btn-ghost btn-sm" onClick={() => setEditing(true)} title="Sửa link"
        style={{padding:'1px 5px',fontSize:11,color:'var(--text-muted)'}}>&#9999;&#65039;</button>
    </div>
  );

  return (
    <span onClick={() => setEditing(true)} title="Thêm link hợp đồng"
      style={{cursor:'pointer',color:'var(--text-muted)',fontSize:12,borderBottom:'1px dashed var(--border)',whiteSpace:'nowrap'}}>
      + Thêm link
    </span>
  );
}

function KOCStatusCell({ value, onChange }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    if (!open) return;
    const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [open]);

  return (
    <div ref={ref} style={{position:'relative'}}>
      <span className={kocBadgeClass(value)} onClick={() => setOpen(o => !o)} style={{cursor:'pointer'}}>{value || '&#8211;'}</span>
      {open && (
        <div style={{position:'absolute',top:'100%',left:0,zIndex:50,background:'var(--surface-1)',border:'1px solid var(--border)',borderRadius:'var(--radius)',boxShadow:'0 4px 12px rgba(0,0,0,0.12)',minWidth:160,marginTop:2}}>
          {KOC_STATUSES.map(s => (
            <div key={s} onClick={() => { onChange(s); setOpen(false); }}
              style={{padding:'8px 12px',cursor:'pointer',fontSize:13,background:s===value?'var(--surface-2)':'transparent'}}
              onMouseEnter={e => e.currentTarget.style.background='var(--surface-2)'}
              onMouseLeave={e => e.currentTarget.style.background=s===value?'var(--surface-2)':'transparent'}>
              <span className={kocBadgeClass(s)}>{s}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function KOCDatabaseTab() {
  const [kocs, loading] = useFirestoreCol('kocs');
  const [search, setSearch] = useState('');
  const [statusFilter, setStatusFilter] = useState('');

  const handleUpdate = (id, changes) => db.collection('kocs').doc(id).update({ ...changes, lastContact: getToday() });
  const handleDelete = (id) => { if (confirm('Xóa KOC này?')) db.collection('kocs').doc(id).delete(); };

  const filtered = useMemo(() => kocs.filter(k => {
    const q = search.toLowerCase();
    const ms = !q || k.name.toLowerCase().includes(q) || (k.instagram||'').toLowerCase().includes(q) || (k.gmail||'').toLowerCase().includes(q);
    return ms && (!statusFilter || k.status === statusFilter);
  }), [kocs, search, statusFilter]);

  const stats = useMemo(() => ({
    total: kocs.length,
    negotiating: kocs.filter(k => k.status === 'Đang trao đổi').length,
    agreed: kocs.filter(k => k.status === 'Đồng ý hợp tác').length,
    booked: kocs.filter(k => k.status === 'Đã xong').length,
  }), [kocs]);

  return (
    <div>
      <div className="stats-bar">
        <StatCard label="Tổng KOC" value={stats.total}/>
        <StatCard label="Đang trao đổi" value={stats.negotiating} color="accent"/>
        <StatCard label="Đồng ý hợp tác" value={stats.agreed} color="success"/>
        <StatCard label="Đã xong" value={stats.booked} color="warning"/>
      </div>
      <PasteParser onAdd={newKocs => newKocs.forEach(k => db.collection('kocs').add(k))}/>
      <div className="toolbar">
        <input className="form-input toolbar-search" placeholder="&#128269; Tìm theo tên, Link IG, Gmail..."
          value={search} onChange={e => setSearch(e.target.value)}/>
        <select className="form-select" value={statusFilter} onChange={e => setStatusFilter(e.target.value)} style={{minWidth:170}}>
          <option value="">Tất cả trạng thái</option>
          {KOC_STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
        </select>
      </div>
      {loading ? (
        <div className="loading-state">&#9203; Đang tải dữ liệu...</div>
      ) : filtered.length === 0 ? (
        <div className="empty-state">
          <div className="empty-icon">&#128101;</div>
          <div className="empty-text">{kocs.length === 0 ? 'Chưa có KOC nào. Dán dữ liệu từ Google Sheets để thêm!' : 'Không tìm thấy KOC nào phù hợp.'}</div>
        </div>
      ) : (
        <div className="card" style={{padding:0,overflow:'hidden'}}>
          <div style={{padding:'10px 16px',background:'var(--surface-2)',borderBottom:'1px solid var(--border)',fontSize:12,color:'var(--text-secondary)'}}>
            Hiển thị {filtered.length} / {kocs.length} KOC
          </div>
          <DualScrollTable>
            <table>
              <thead>
                <tr>
                  <th style={{width:36}}>#</th>
                  <th>Tên</th><th>Link IG</th><th>Gmail</th><th>Follow IG</th>
                  <th>Trạng thái</th><th>Báo giá (TWD)</th><th>Ghi chú</th>
                  <th>Địa chỉ</th><th>Số TK</th><th>Hợp đồng</th><th>Liên hệ cuối</th><th></th>
                </tr>
              </thead>
              <tbody>
                {filtered.map((k, i) => (
                  <tr key={k.id}>
                    <td style={{color:'var(--text-muted)',textAlign:'center'}}>{i+1}</td>
                    <td style={{minWidth:120,fontWeight:500}}><EditableCell value={k.name} onChange={v => handleUpdate(k.id,{name:v})}/></td>
                    <td style={{minWidth:140}}>
                      {k.instagram && k.instagram.startsWith('http') ? (
                        <a href={k.instagram} target="_blank" rel="noopener" style={{color:'var(--accent)',fontSize:12,whiteSpace:'nowrap'}}>
                          {k.instagram.replace('https://www.instagram.com/','@').replace(/\/$/,'')}
                        </a>
                      ) : <EditableCell value={k.instagram} onChange={v => handleUpdate(k.id,{instagram:v})}/>}
                    </td>
                    <td style={{minWidth:160}}><EditableCell value={k.gmail} onChange={v => handleUpdate(k.id,{gmail:v})}/></td>
                    <td style={{minWidth:70}}><EditableCell value={k.followers} onChange={v => handleUpdate(k.id,{followers:v})}/></td>
                    <td style={{minWidth:150}}><KOCStatusCell value={k.status} onChange={v => handleUpdate(k.id,{status:v})}/></td>
                    <td style={{minWidth:90}}><EditableCell value={k.price} onChange={v => handleUpdate(k.id,{price:v})}/></td>
                    <td style={{minWidth:180}}><EditableCell value={k.notes} onChange={v => handleUpdate(k.id,{notes:v})}/></td>
                    <td style={{minWidth:160}}><EditableCell value={k.address} onChange={v => handleUpdate(k.id,{address:v})}/></td>
                    <td style={{minWidth:130}}><EditableCell value={k.bankAccount} onChange={v => handleUpdate(k.id,{bankAccount:v})}/></td>
                    <td style={{minWidth:140}}>
                      <ContractLinkCell value={k.contractLink||''} onChange={v => db.collection('kocs').doc(k.id).update({contractLink:v})}/>
                    </td>
                    <td style={{whiteSpace:'nowrap',fontSize:12,color:'var(--text-secondary)'}}>{k.lastContact||'&#8211;'}</td>
                    <td><button className="btn btn-danger btn-sm btn-icon" onClick={() => handleDelete(k.id)}>&#128465;</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </DualScrollTable>
        </div>
      )}
    </div>
  );
}

/* ── API SETTINGS (Gemini) ── */
function APISettings({ apiKey, onSave }) {
  const [key, setKey] = useState(apiKey || '');
  const [saved, setSaved] = useState(false);
  const handleSave = () => { onSave(key.trim()); setSaved(true); setTimeout(() => setSaved(false), 2000); };

  if (apiKey) return (
    <div className="alert alert-success" style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
      <span>&#10003; Gemini API key đã được cấu hình</span>
      <button className="btn btn-secondary btn-sm" onClick={() => onSave('')}>Xóa key</button>
    </div>
  );

  return (
    <div className="api-settings">
      <div className="api-settings-title">&#128273; Cấu hình Gemini API Key (Miễn phí)</div>
      <div style={{fontSize:12,color:'var(--warning-text)',marginBottom:10,lineHeight:1.6}}>
        Lấy key miễn phí tại <strong>aistudio.google.com</strong> → Get API key → Create API key.<br/>
        Key được lưu trong browser của bạn, không gửi đi đâu khác.
      </div>
      <div className="api-settings-row">
        <input className="form-input" type="password" placeholder="AIza..." value={key}
          onChange={e => setKey(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleSave()}
          style={{flex:1}}/>
        <button className="btn btn-primary" onClick={handleSave} disabled={!key.trim()}>
          {saved ? '✅ Đã lưu' : 'Lưu key'}
        </button>
      </div>
    </div>
  );
}

function TranslationTab({ mode }) {
  const [apiKey, setApiKey] = useLocalStorage('marcomos_api_key', '');
  const [translations, loadingTrans] = useFirestoreCol('translations');
  const [templates, loadingTpl] = useFirestoreCol('templates');
  const [source, setSource] = useState('');
  const [result, setResult] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [copied, setCopied] = useState(false);
  const [histSearch, setHistSearch] = useState('');
  const [tplName, setTplName] = useState('');
  const [showTplSave, setShowTplSave] = useState(false);

  const canTranslate = source.trim() && (mode === 'proxy' || apiKey);

  const doTranslate = async () => {
    if (!canTranslate) return;
    setLoading(true); setError(''); setResult('');
    try {
      const text = mode === 'proxy' ? await translateProxy(source) : await translateDirect(source, apiKey);
      setResult(text);
    } catch (e) { setError(e.message || 'Dịch thất bại. Vui lòng thử lại.'); }
    finally { setLoading(false); }
  };

  const doCopy = () => {
    if (!result) return;
    navigator.clipboard.writeText(result).then(() => { setCopied(true); setTimeout(() => setCopied(false), 2000); });
  };

  const saveHistory = () => {
    if (!source || !result) return;
    db.collection('translations').add({ source, result, createdAt: new Date().toISOString() });
    setSource(''); setResult('');
  };

  const saveTemplate = () => {
    if (!tplName.trim() || !source.trim()) return;
    db.collection('templates').add({ name: tplName.trim(), content: source, createdAt: new Date().toISOString() });
    setTplName(''); setShowTplSave(false);
  };

  const filteredHist = useMemo(() => {
    if (!histSearch) return translations;
    const q = histSearch.toLowerCase();
    return translations.filter(t => t.source.toLowerCase().includes(q) || t.result.toLowerCase().includes(q));
  }, [translations, histSearch]);

  return (
    <div>
      <div className="stats-bar">
        <StatCard label="Đã dịch" value={translations.length} color="accent"/>
        <StatCard label="Templates" value={templates.length}/>
      </div>
      {mode === 'direct' && <APISettings apiKey={apiKey} onSave={setApiKey}/>}
      <div className="card">
        <div className="card-title" style={{marginBottom:14}}>&#127760; Dịch Đài Loan → Việt Nam</div>
        <div className="translation-grid">
          <div className="translation-panel">
            <div className="translation-label">&#128229; Tiếng Trung (Đài Loan)</div>
            <textarea className="form-textarea translation-area" value={source} onChange={e => setSource(e.target.value)}
              placeholder="Dán văn bản tiếng Trung vào đây..."/>
          </div>
          <div className="translation-panel">
            <div className="translation-label">&#128228; Tiếng Việt</div>
            <textarea className="form-textarea translation-area" value={result} onChange={e => setResult(e.target.value)}
              placeholder="Bản dịch sẽ xuất hiện ở đây..." readOnly={loading}/>
          </div>
        </div>
        {error && <div className="alert alert-danger">{error}</div>}
        <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:4}}>
          <button className="btn btn-primary btn-lg" onClick={doTranslate} disabled={!canTranslate || loading}>
            {loading ? <><span className="spinner"></span> Đang dịch...</> : '🔄 Dịch'}
          </button>
          <button className="btn btn-secondary" onClick={doCopy} disabled={!result}>
            {copied ? '✅ Đã sao chép!' : '&#128203; Sao chép'}
          </button>
          <button className="btn btn-secondary" onClick={saveHistory} disabled={!source||!result}>&#128190; Lưu lịch sử</button>
          <button className="btn btn-secondary" onClick={() => setShowTplSave(!showTplSave)} disabled={!source}>&#128204; Lưu template</button>
        </div>
        {showTplSave && (
          <div style={{display:'flex',gap:8,marginTop:10}}>
            <input className="form-input" placeholder="Tên template..." value={tplName}
              onChange={e => setTplName(e.target.value)} onKeyDown={e => e.key==='Enter'&&saveTemplate()} style={{flex:1}}/>
            <button className="btn btn-primary" onClick={saveTemplate} disabled={!tplName.trim()}>Lưu</button>
            <button className="btn btn-secondary" onClick={() => setShowTplSave(false)}>Hủy</button>
          </div>
        )}
      </div>
      {!loadingTpl && templates.length > 0 && (
        <div className="card">
          <div className="card-title" style={{marginBottom:12}}>&#128204; Templates ({templates.length})</div>
          {templates.map(t => (
            <div key={t.id} className="template-item">
              <span className="template-name">{t.name}</span>
              <span className="template-preview">{t.content.substring(0,100)}{t.content.length>100?'…':''}</span>
              <button className="btn btn-secondary btn-sm" onClick={() => setSource(t.content)}>Dùng</button>
              <button className="btn btn-danger btn-sm btn-icon" onClick={() => db.collection('templates').doc(t.id).delete()}>&#128465;</button>
            </div>
          ))}
        </div>
      )}
      <div className="card">
        <div className="card-title" style={{marginBottom:12}}>&#128220; Lịch sử dịch ({translations.length})</div>
        {translations.length > 0 && (
          <input className="form-input" placeholder="&#128269; Tìm trong lịch sử..." value={histSearch}
            onChange={e => setHistSearch(e.target.value)} style={{marginBottom:12}}/>
        )}
        {loadingTrans ? (
          <div className="loading-state">&#9203; Đang tải...</div>
        ) : filteredHist.length === 0 ? (
          <div className="empty-state" style={{padding:24}}>
            <div className="empty-icon">&#128220;</div>
            <div className="empty-text">{translations.length===0?'Chưa có lịch sử dịch.':'Không tìm thấy.'}</div>
          </div>
        ) : filteredHist.map(t => (
          <div key={t.id} className="history-item">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8}}>
              <div style={{flex:1,minWidth:0}}>
                <div className="history-source">&#127481;&#127484; {t.source.substring(0,120)}{t.source.length>120?'…':''}</div>
                <div className="history-result">&#127483;&#127475; {t.result.substring(0,120)}{t.result.length>120?'…':''}</div>
                <div className="history-time">{formatDT(t.createdAt)}</div>
              </div>
              <div style={{display:'flex',gap:4,flexShrink:0}}>
                <button className="btn btn-secondary btn-sm" onClick={() => { setSource(t.source); setResult(t.result); }}>Dùng lại</button>
                <button className="btn btn-danger btn-sm btn-icon" onClick={() => db.collection('translations').doc(t.id).delete()}>&#128465;</button>
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function App() {
  const [activeTab, setActiveTab] = useState('koc');
  const [theme, setTheme] = useLocalStorage('marcomos_theme', 'light');
  useEffect(() => { document.documentElement.setAttribute('data-theme', theme); }, [theme]);
  const tabs = [
    { id: 'koc', label: '👥 KOC Database' },
    { id: 'translation', label: '🌐 Translation' }
  ];
  return (
    <div id="app">
      <header className="app-header">
        <div className="app-logo">
          <span className="app-logo-icon">&#127916;</span>
          <div>
            <div>MarcomOS</div>
            <div className="app-logo-sub">Marcom Department</div>
          </div>
        </div>
        <div className="header-actions">
          <button className="btn btn-ghost btn-sm btn-icon"
            onClick={() => setTheme(t => t==='light'?'dark':'light')}
            title={theme==='light'?'Dark mode':'Light mode'}>
            {theme==='light'?'🌙':'☀️'}
          </button>
        </div>
      </header>
      <nav className="tab-nav">
        {tabs.map(tab => (
          <button key={tab.id} className={`tab-btn${activeTab===tab.id?' active':''}`}
            onClick={() => setActiveTab(tab.id)}>{tab.label}</button>
        ))}
      </nav>
      <main className="tab-content">
        {activeTab==='koc' && <KOCDatabaseTab/>}
        {activeTab==='translation' && <TranslationTab mode={TRANSLATION_MODE}/>}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
